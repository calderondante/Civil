[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-audio-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.163.1", "uvicorn==0.54.0", "SQLAlchemy==2.1.8", "psycopg[binary]==3.3.9", "httpx==0.28.1", "python-multipart==0.0.33", "espeakng-loader==0.2.4"]

[project.optional-dependencies]
free-cloud = ["kokoro-onnx==0.6.1", "onnxruntime==1.32.0", "soundfile==0.14.0", "sherpa-onnx==2.0.1", "python-docx==1.2.0", "pdfplumber==0.11.9", "pypdf==6.12.0"]
test = ["pytest==9.2.0", "reportlab==4.4.10"]
asr = ["faster-whisper>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["aas*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
