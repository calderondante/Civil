# Local/private single-workspace deployment. Configure TLS at the host's ingress.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      STUDIO_DATA_DIR: /data
    volumes: ["studio-data:/data"]
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "aas.worker"]
    env_file: .env
    environment:
      STUDIO_DATA_DIR: /data
    volumes: ["studio-data:/data"]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      API_URL: http://api:8010
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  studio-data:
